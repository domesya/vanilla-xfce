name: misc-setup
type: shell
commands:
  # Make init.d scripts executable
  - chmod +x /usr/share/init.d/*
  - systemctl enable oomd.service
  - systemctl enable lightdm.service
  - printf '[Desktop Entry]\nName=FirstSetup\nComment=This session provides a First Setup interface\nExec=/usr/bin/startxfce4\nType=Application\nDesktopNames=XFCE\nNoDisplay=true\n' > /usr/share/xsessions/firstsetup.desktop
  - printf '[Desktop Entry]\nName=FirstSetup\nComment=This session provides a First Setup interface\nExec=/usr/bin/startxfce4\nType=Application\nDesktopNames=XFCE\nNoDisplay=true\n' > /usr/share/wayland-sessions/firstsetup.desktop
  - rm -f /usr/lib/*/gnome-software/plugins-*/libgs_plugin_packagekit.so
  